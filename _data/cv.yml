- title: Software, Websites and Datasets
  count: true
  type: nested_list
  contents:
    - title: CDLI platform
      items:
        - '<a href="https://cdli.earth">cdli.earth</a>, the Cuneiform Digital Library Initiative website. Lead.'
        - '<a href="https://gitlab.com/cdli/framework">CDLI framework</a>, the open-source platform behind the site, in active development since 2017. Lead.'
        - '<a href="https://cdli.earth/docs">Documentation</a> and <a href="https://cdli.earth/resources/sparql">knowledge graph with SPARQL endpoint</a>. Team.'
        - '<a href="https://github.com/cdli-gh/framework-api-client">API client</a> and <a href="https://github.com/cdli-gh/data">data releases</a>, the daily catalogue and text dumps now served through the API. Lead on data, team on client.'
    - title: MTAAC outputs, Sumerian natural language processing (2017–2021)
      items:
        - '<a href="https://github.com/cdli-gh/Sumerian-Translation-Pipeline">Sumerian translation pipeline</a>: part-of-speech tagging, named-entity recognition and machine translation for Ur III texts. Team.'
        - '<a href="https://github.com/cdli-gh/Semi-Supervised-NMT-for-Sumerian-English">Semi-supervised NMT for Sumerian–English</a> and <a href="https://github.com/cdli-gh/Machine-Translation">neural machine translation</a> experiments. Mentor.'
        - '<a href="https://github.com/cdli-gh/mtaac_gold_corpus">Gold corpus</a>, <a href="https://github.com/cdli-gh/mtaac_syntax_corpus">dependency syntax corpus</a> and <a href="https://github.com/cdli-gh/mtaac_cdli_ur3_corpus">Ur III corpus</a> of manually annotated Sumerian. Team.'
        - 'Annotation tools: <a href="https://github.com/cdli-gh/atf2conll-convertor">atf2conll</a>, <a href="https://github.com/cdli-gh/morphology-pre-annotation-tool">morphology pre-annotation</a>, <a href="https://github.com/cdli-gh/annotation_assistant">annotation assistant</a>, <a href="https://github.com/cdli-gh/brat_to_cdli_conll_converter">Brat to CoNLL converter</a>, <a href="https://github.com/cdli-gh/conllu.py">conllu.py</a>. Team and mentor.'
        - '<a href="https://github.com/cdli-gh/mtaac">Project website</a> and <a href="https://github.com/cdli-gh/mtaac_work">work packages</a>. Lead.'
    - title: Research tools
      items:
        - '<a href="https://github.com/cdli-gh/conll2graphml">conll2graphml</a>, network graphs of people co-occurring in texts, used for the Adab prosopography. Lead.'
        - '<a href="https://github.com/cdli-gh/atf2conc">atf2conc</a>, text preparation for concordance software. Lead.'
        - '<a href="https://github.com/epageperron/cuneiform_mining">cuneiform_mining</a>, database and interface to collect, standardise, mine and visualise cuneiform data. Lead.'
        - '<a href="https://github.com/epageperron/UrIIIPro">UrIIIPro</a>, Ur III provenience classification in R. Lead.'
    - title: Vocabularies and ontologies
      items:
        - '<a href="https://github.com/cdli-gh/glow_vocabularies">GLoW vocabularies</a> for inscribed artefact metadata. Team.'
        - '<a href="https://doi.org/10.5281/zenodo.15268834">AO-Cat ontology</a>, the CIDOC CRM based ontology of the ARIADNE catalogue. Team.'
    - title: Archaeological data infrastructure
      items:
        - '<a href="https://ariadne-portal.d4science.org/">ARIADNE portal</a>, ingestion and mapping of partner datasets, including CDLI records. Team.'
        - '<a href="https://github.com/uoy-ads/welsh-trusts-greylit">welsh-trusts-greylit</a>, ingest of Welsh Trusts grey literature into the ADS Library. Lead.'
        - '<a href="https://github.com/Diyala-OI/interface">Diyala interface</a>, map-based navigation of the Diyala Project small finds. Lead.'
    - title: Mentored projects (Google Summer of Code and students, 2018–2022)
      items:
        - '<a href="https://github.com/cdli-gh/Cuneiform-OCR">Cuneiform OCR</a>, line and sign detection on tablet images.'
        - '<a href="https://github.com/cdli-gh/cdli-mobile-app">CDLI mobile app</a> and <a href="https://github.com/cdli-gh/cdli-tablet-app">tablet app</a>.'
        - '<a href="https://github.com/cdli-gh/pyoracc">pyoracc</a>, Python tools for working with ATF.'
        - '<a href="https://github.com/cdli-gh/coco-convertor">coco-convertor</a>, converts COCO image annotations to the open annotation format.'
        - '<a href="https://github.com/cdli-gh/pub_file_entity_extractor">Publication entity extractor</a>, finds CDLI entities in publication PDFs.'
        - '<a href="https://github.com/cdli-gh/publication-merging">Publication merging</a>, de-duplication of bibliographic records.'
        - '<a href="https://github.com/cdli-gh/database-schema">Temporal data schema</a>, granular temporal data management for the CDLI.'

